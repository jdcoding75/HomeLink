name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Newer push to the same ref cancels an in-flight run (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (ConnectionClusterTests)
    runs-on: macos-26          # Tahoe — ships Xcode 26 (iOS 26 SDK required to COMPILE: MKGeocodingRequest)
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          d = json.load(sys.stdin)["devices"]
          cands = [dev for rt, devs in d.items() if "iOS" in rt
                   for dev in devs if dev["name"].startswith("iPhone")]
          print(cands[-1]["udid"] if cands else "")
          ')
          if [ -z "$UDID" ]; then echo "::error::No iPhone simulator available on the runner"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Build & run ConnectionClusterTests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme HomeLink \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HomeLinkTests/ConnectionClusterTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
