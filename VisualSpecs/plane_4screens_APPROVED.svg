    <g id="s4-wooden-bucket" transform="translate(245, 665)">
      <path d="M 10,15 L 110,15 L 98,95 C 98,95 85,100 60,100 C 35,100 22,95 22,95 Z" fill="url(#wood-grad)" stroke="#2d1a08" stroke-width="0.8" />
      <line x1="40" y1="16" x2="44" y2="97" stroke="#2a1f12" stroke-width="1.8" opacity="0.85" />
      <line x1="60" y1="17" x2="60" y2="100" stroke="#2a1f12" stroke-width="1.8" opacity="0.95" />
      <line x1="80" y1="16" x2="76" y2="97" stroke="#2a1f12" stroke-width="1.8" opacity="0.85" />
      <path d="M 14,56 C 40,62 80,62 106,56 L 105,62 C 80,68 40,68 15,62 Z" fill="url(#brass-grad)" />
      <ellipse cx="60" cy="15" rx="50" ry="12" fill="#3d230a" stroke="url(#brass-grad)" stroke-width="2" />
      <path d="M 10,15 C 10,-15 110,-15 110,15" fill="none" stroke="url(#brass-grad)" stroke-width="2.2" opacity="0.8" />
