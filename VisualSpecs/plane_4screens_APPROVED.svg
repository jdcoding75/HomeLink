<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 453 3778" width="100%" role="img">
  <defs>
    <linearGradient id="sky-inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d4a" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>
    <linearGradient id="sky-full" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d4a" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>
    <linearGradient id="wood-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a2e10" />
      <stop offset="50%" stop-color="#7a4e28" />
      <stop offset="100%" stop-color="#4a2e10" />
    </linearGradient>
    <linearGradient id="brass-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a7320" />
      <stop offset="50%" stop-color="#e8c060" />
      <stop offset="100%" stop-color="#9a7320" />
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="blur-spin" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>
    <filter id="trail-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="short-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
    <clipPath id="compass-clip">
      <circle cx="196" cy="392" r="148" />
    </clipPath>
  </defs>

  <g id="screen-1-idle" transform="translate(30, 40)">
    <text x="0" y="-15" font-family="Georgia" font-size="15" fill="#c4a8d4" letter-spacing="1.5">SCREEN 1: COMPASS FACE IDLE</text>
    <rect x="0" y="0" width="393" height="852" fill="#0d0d14" />
    <text x="196" y="115" font-family="Georgia" font-style="italic" font-size="13" fill="#e8c060" fill-opacity="0.38" text-anchor="middle">pointing toward Sarah</text>
    <g id="s1-compass-world" clip-path="url(#compass-clip)">
      <rect x="48" y="244" width="296" height="296" fill="url(#sky-inside)" />
    </g>
    <g id="s1-compass-ring">
      <circle cx="196" cy="392" r="148" fill="none" stroke="#5a4870" stroke-width="1.8" />
      <g stroke="#5a4870" stroke-width="1" opacity="0.6">
        <line x1="196" y1="244" x2="196" y2="251" />
        <line x1="196" y1="533" x2="196" y2="540" />
        <line x1="48" y1="392" x2="55" y2="392" />
        <line x1="337" y1="392" x2="344" y2="392" />
