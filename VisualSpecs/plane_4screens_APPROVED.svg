        <path d="M -75,2 C -72,0 -68,0 -65,2 L -65,6 C -68,8 -72,7 -75,5 Z" fill="#c4a8d4" opacity="0.7" />
        <path d="M 75,2 C 72,0 68,0 65,2 L 65,6 C 68,8 72,7 75,5 Z" fill="#c4a8d4" opacity="0.7" />
        <ellipse cx="0" cy="0" rx="18" ry="22" fill="#e8e0f0" />
        <path d="M -12,-6 C -12,-16 0,-20 0,-20 C 0,-20 12,-16 12,-6 C 12,2 8,6 0,6 C -8,6 -12,2 -12,-6 Z" fill="#1a2d4a" opacity="0.2" />
        <path d="M -18,10 L -38,13 C -38,15 -30,17 -18,15 Z" fill="#c4a8d4" />
        <path d="M 18,10 L 38,13 C 38,15 30,17 18,15 Z" fill="#c4a8d4" />
        <path d="M -3,-22 C -3,-32 0,-35 0,-35 C 0,-35 3,-32 3,-22 Z" fill="#c4a8d4" />
      </g>
      <g id="s1-propeller">
