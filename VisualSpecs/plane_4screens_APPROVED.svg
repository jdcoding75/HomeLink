        <circle cx="0" cy="0" r="2.5" fill="#e8c060" />
        <path d="M -5,0 C -25,-12 -48,-14 -52,-7 C -55,-1 -32,5 -5,0 Z" fill="#e8e0f0" stroke="#c4a8d4" stroke-width="0.5" opacity="0.95" />
        <path d="M 5,0 C 25,-12 48,-14 52,-7 C 55,-1 32,5 5,0 Z" fill="#e8e0f0" stroke="#c4a8d4" stroke-width="0.5" opacity="0.95" />
      </g>
        <text x="196" y="430" font-size="18" text-anchor="middle" font-family="serif">🤗</text>
    </g>
    <text x="196" y="610" font-family="Georgia" font-size="20" fill="#e8e0f0" text-anchor="middle">[Sarah]</text>
    <text x="196" y="638" font-family="Georgia" font-size="13" fill="#9b8fa8" text-anchor="middle">1.2 miles away</text>
    <text x="196" y="745" font-family="Georgia" font-style="italic" font-size="12" fill="#c4a8d4" fill-opacity="0.28" text-anchor="middle">spin the propeller to send a thought.</text>
  </g>

  <g id="screen-2-charging" transform="translate(30, 982)">
    <text x="0" y="-15" font-family="Georgia" font-size="15" fill="#c4a8d4" letter-spacing="1.5">SCREEN 2: COMPASS FACE CHARGING</text>
    <rect x="0" y="0" width="393" height="852" fill="#0d0d14" />
    <text x="196" y="115" font-family="Georgia" font-style="italic" font-size="13" fill="#e8c060" fill-opacity="0.38" text-anchor="middle">pointing toward Sarah</text>
    <g id="s2-compass-world" clip-path="url(#compass-clip)">
      <rect x="48" y="244" width="296" height="296" fill="url(#sky-inside)" />
    </g>
    <g id="s2-compass-ring">
