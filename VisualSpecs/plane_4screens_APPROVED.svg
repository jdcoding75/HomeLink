    <text x="196" y="638" font-family="Georgia" font-size="13" fill="#9b8fa8" text-anchor="middle">1.2 miles away</text>
    <text x="196" y="745" font-family="Georgia" font-style="italic" font-size="12" fill="#f0d060" text-anchor="middle">building kinetic momentum...</text>
  </g>

