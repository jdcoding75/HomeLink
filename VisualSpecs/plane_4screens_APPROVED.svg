        <path d="M -40,7 C -40,10 -30,9 -11,3 L -11,-4 C -28,-2 -40,3 -40,7 Z" fill="#e8e0f0" />
        <path d="M 40,7 C 40,10 30,9 11,3 L 11,-4 C 28,-2 40,3 40,7 Z" fill="#e8e0f0" />
        <path d="M -4,22 C -11,26 -13,30 -13,32 C -13,33 -9,32 0,27 Z" fill="#c4a8d4" />
      </g>
