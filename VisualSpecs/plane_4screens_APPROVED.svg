      <path d="M 135,222 C 145,245 145,260 142,273" fill="none" stroke="#c4a8d4" stroke-width="0.8" opacity="0.5" />
      <path d="M 160,210 L 160,275" fill="none" stroke="#c4a8d4" stroke-width="1.0" opacity="0.6" />
      <path d="M 185,222 C 175,245 175,260 178,273" fill="none" stroke="#c4a8d4" stroke-width="0.8" opacity="0.5" />
      <g stroke="#e8e0f0" stroke-width="0.8" opacity="0.6">
        <line x1="112" y1="271" x2="160" y2="335" />
        <line x1="135" y1="274" x2="160" y2="335" />
        <line x1="160" y1="275" x2="160" y2="335" />
        <line x1="185" y1="274" x2="160" y2="335" />
        <line x1="208" y1="271" x2="160" y2="335" />
